events {
    worker_connections 1024;
}

http {
    upstream movida_api {
        least_conn;
        server api-1:3000 max_fails=3 fail_timeout=10s;
        server api-2:3000 max_fails=3 fail_timeout=10s;
    }

    # Simula Application Load Balancer (HTTP) na camada de aplicacao
    server {
        listen 80;
        server_name _;

        location /health {
            proxy_pass http://movida_api/health;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }

        location / {
            proxy_pass http://movida_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}
