# Ecossistema Movida Lab — UST (env/service/version) + DBM
# Uso: cp .env.example .env && ./scripts/compose.sh up -d --build

name: movida-datadog-lab

x-ust-env: &ust-env
  DD_ENV: ${DD_ENV:-movida-lab}
  DD_VERSION: ${DD_VERSION:-1.0.0}

x-ust-labels: &ust-labels
  com.datadoghq.tags.env: ${DD_ENV:-movida-lab}
  com.datadoghq.tags.version: ${DD_VERSION:-1.0.0}

services:
  # --- Camada de Banco (Cluster PostgreSQL) ---
  pg-primary:
    image: postgres:16-alpine
    container_name: pg-primary
    hostname: pg-primary
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - pg_stat_statements.max=10000
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - hot_standby=on
    environment:
      POSTGRES_DB: movida
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_admin}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replica_secret}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-movida_secret}
    volumes:
      - pg-primary-data:/var/lib/postgresql/data
      - ./postgres/primary/init:/docker-entrypoint-initdb.d:ro
    networks:
      - movida-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d movida"]
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      <<: *ust-labels
      com.datadoghq.tags.service: ${DD_SERVICE_PG_PRIMARY:-movida-pg-primary}
      com.datadoghq.ad.logs: '[{"source":"postgresql","service":"movida-pg-primary"}]'

  pg-replica:
    build: ./postgres/replica
    container_name: pg-replica
    hostname: pg-replica
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_admin}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replica_secret}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pg-replica-data:/var/lib/postgresql/data
    depends_on:
      pg-primary:
        condition: service_healthy
    networks:
      - movida-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 60s
    labels:
      <<: *ust-labels
      com.datadoghq.tags.service: ${DD_SERVICE_PG_REPLICA:-movida-pg-replica}
      com.datadoghq.ad.logs: '[{"source":"postgresql","service":"movida-pg-replica"}]'

  # HAProxy = LB externo (NLB) — encaminha para o PostgreSQL Router
  haproxy-db:
    image: haproxy:2.9-alpine
    container_name: haproxy-db
    hostname: haproxy-db
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "${DB_LB_PORT:-5432}:5432"
      - "${DB_READ_LB_PORT:-5433}:5433"
    depends_on:
      pg-router:
        condition: service_started
    networks:
      - movida-net
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      <<: *ust-labels
      com.datadoghq.tags.service: ${DD_SERVICE_PG_LB:-movida-pg-haproxy}
      com.datadoghq.ad.logs: '[{"source":"haproxy","service":"movida-pg-haproxy"}]'

  # PostgreSQL Router — portas 6446 (escrita) / 6447 (leitura), conceito MySQL Router / SPQR
  pg-router:
    image: haproxy:2.9-alpine
    container_name: pg-router
    hostname: pg-router
    volumes:
      - ./pg-router/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "${PG_ROUTER_WRITE_PORT:-6446}:6446"
      - "${PG_ROUTER_READ_PORT:-6447}:6447"
    depends_on:
      pg-primary:
        condition: service_healthy
      pg-replica:
        condition: service_healthy
    networks:
      - movida-net
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      <<: *ust-labels
      com.datadoghq.tags.service: ${DD_SERVICE_PG_ROUTER:-movida-pg-router}
      com.datadoghq.ad.logs: '[{"source":"haproxy","service":"movida-pg-router"}]'

  # --- Camada de Aplicacao (Node.js) ---
  api-1:
    build:
      context: ./app
      args:
        DD_SERVICE: ${DD_SERVICE_API:-movida-reservas-api}
        DD_VERSION: ${DD_VERSION:-1.0.0}
    container_name: api-1
    hostname: api-1
    environment: &api_env
      <<: *ust-env
      INSTANCE_ID: api-1
      PORT: 3000
      # APP -> LB externo -> Router (6446 escrita) -> PRIMARY
      PGHOST: haproxy-db
      PGPORT: 5432
      PGHOST_READ: pg-router
      PGPORT_READ: 6447
      PGDATABASE: movida
      PGUSER: movida_app
      PGPASSWORD: ${APP_DB_PASSWORD:-movida_secret}
      DD_AGENT_HOST: datadog-agent
      DD_TRACE_AGENT_PORT: 8126
      DD_SERVICE: ${DD_SERVICE_API:-movida-reservas-api}
      DD_LOGS_INJECTION: "true"
      DD_RUNTIME_METRICS_ENABLED: "true"
      DD_PROFILING_ENABLED: ${DD_PROFILING_ENABLED:-false}
      DD_DBM_PROPAGATION_MODE: full
      DD_TAGS: "app_instance:api-1,db_load_balancer:${DD_SERVICE_PG_LB:-movida-pg-haproxy},db_router:${DD_SERVICE_PG_ROUTER:-movida-pg-router},db_cluster:movida-pg"
    depends_on:
      haproxy-db:
        condition: service_started
      datadog-agent:
        condition: service_started
    networks:
      - movida-net
    labels:
      <<: *ust-labels
      com.datadoghq.tags.service: ${DD_SERVICE_API:-movida-reservas-api}
      com.datadoghq.ad.logs: '[{"source":"nodejs","service":"movida-reservas-api"}]'

  api-2:
    build:
      context: ./app
      args:
        DD_SERVICE: ${DD_SERVICE_API:-movida-reservas-api}
        DD_VERSION: ${DD_VERSION:-1.0.0}
    container_name: api-2
    hostname: api-2
    environment:
      <<: *api_env
      INSTANCE_ID: api-2
      DD_TAGS: "app_instance:api-2,db_load_balancer:${DD_SERVICE_PG_LB:-movida-pg-haproxy},db_router:${DD_SERVICE_PG_ROUTER:-movida-pg-router},db_cluster:movida-pg"
    depends_on:
      haproxy-db:
        condition: service_started
      datadog-agent:
        condition: service_started
    networks:
      - movida-net
    labels:
      <<: *ust-labels
      com.datadoghq.tags.service: ${DD_SERVICE_API:-movida-reservas-api}
      com.datadoghq.ad.logs: '[{"source":"nodejs","service":"movida-reservas-api"}]'

  # Nginx = ALB HTTP das APIs
  alb-app:
    image: nginx:1.27-alpine
    container_name: alb-app
    hostname: alb-app
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${APP_ALB_PORT:-8080}:80"
    depends_on:
      - api-1
      - api-2
    networks:
      - movida-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      <<: *ust-labels
      com.datadoghq.tags.service: ${DD_SERVICE_APP_LB:-movida-app-alb}
      com.datadoghq.ad.logs: '[{"source":"nginx","service":"movida-app-alb"}]'

  # --- Observabilidade (Datadog Agent) ---
  datadog-agent:
    image: gcr.io/datadoghq/agent:7.60.1
    container_name: datadog-agent
    pid: host
    environment:
      <<: *ust-env
      DD_API_KEY: ${DD_API_KEY:?Defina DD_API_KEY no arquivo .env}
      DD_SITE: ${DD_SITE:-us5.datadoghq.com}
      DD_HOSTNAME: ${DD_HOSTNAME:-movida-ec2-lab}
      DD_TAGS: "project:db-cluster-postgresql-nodejs customer:movida"
      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
      DD_CONTAINER_EXCLUDE: "name:datadog-agent"
      DD_PROCESS_AGENT_ENABLED: "true"
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true"
      DD_AC_EXCLUDE: "name:datadog-agent"
      DD_DBM_ENABLED: "true"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_admin}
      DD_SERVICE_PG_PRIMARY: ${DD_SERVICE_PG_PRIMARY:-movida-pg-primary}
      DD_SERVICE_PG_REPLICA: ${DD_SERVICE_PG_REPLICA:-movida-pg-replica}
      DD_SERVICE_PG_LB: ${DD_SERVICE_PG_LB:-movida-pg-haproxy}
      DD_SERVICE_PG_ROUTER: ${DD_SERVICE_PG_ROUTER:-movida-pg-router}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
      - ./datadog/datadog.yaml:/etc/datadog-agent/datadog.yaml:ro
      - ./datadog/conf.d/postgres.d:/etc/datadog-agent/conf.d/postgres.d:ro
    networks:
      - movida-net
    ports:
      - "8126:8126"
      - "8125:8125/udp"
    labels:
      <<: *ust-labels
      com.datadoghq.tags.service: datadog-agent

  # Trafego continuo (1 req/ciclo a cada 60s) — profile: traffic
  traffic-loop:
    image: curlimages/curl:8.11.1
    container_name: traffic-loop
    profiles: ["traffic"]
    environment:
      BASE_URL: http://alb-app:80
      INTERVAL_SECONDS: ${TRAFFIC_INTERVAL_SECONDS:-60}
    volumes:
      - ./scripts/continuous-traffic.sh:/scripts/continuous-traffic.sh:ro
    entrypoint: ["/bin/sh", "/scripts/continuous-traffic.sh"]
    depends_on:
      - alb-app
    networks:
      - movida-net
    restart: unless-stopped

  # Trafego agressivo (legado) — profile: loadgen
  loadgen:
    image: curlimages/curl:8.11.1
    container_name: loadgen
    profiles: ["loadgen"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Gerando trafego contra ALB (alb-app:80)..."
        while true; do
          curl -sf "http://alb-app/health" > /dev/null
          curl -sf "http://alb-app/api/status" > /dev/null
          curl -sf "http://alb-app/api/reservas" > /dev/null
          curl -sf -X POST "http://alb-app/api/reservas" \
            -H "Content-Type: application/json" \
            -d "{\"cliente\":\"Cliente Demo\",\"veiculo\":\"SUV\",\"dias\":3}" > /dev/null
          curl -sf "http://alb-app/api/metrics/load" > /dev/null
          sleep 2
        done
    depends_on:
      - alb-app
    networks:
      - movida-net

networks:
  movida-net:
    driver: bridge

volumes:
  pg-primary-data:
  pg-replica-data:
