init_config:

instances:
  # ── LB externo (APP -> haproxy-db:5432) ──
  - host: haproxy-db
    port: 5432
    username: "%%env_POSTGRES_USER%%"
    password: "%%env_POSTGRES_PASSWORD%%"
    dbname: movida
    reported_hostname: "%%env_DD_SERVICE_PG_LB%%"
    dbm: true
    query_metrics:
      enabled: false
    query_samples:
      enabled: false
    collect_schemas:
      enabled: false
    tags:
      - "env:%%env_DD_ENV%%"
      - "service:%%env_DD_SERVICE_PG_LB%%"
      - "version:%%env_DD_VERSION%%"
      - "cluster:movida-pg"
      - "db_cluster:movida-pg"
      - "db_role:load_balancer"
      - "db_load_balancer:%%env_DD_SERVICE_PG_LB%%"
      - "db_router:%%env_DD_SERVICE_PG_ROUTER%%"

  # ── Router ESCRITA :6446 (onde as queries da app sao roteadas ao PRIMARY) ──
  - host: pg-router
    port: 6446
    username: "%%env_POSTGRES_USER%%"
    password: "%%env_POSTGRES_PASSWORD%%"
    dbname: movida
    reported_hostname: "%%env_DD_SERVICE_PG_ROUTER%%"
    dbm: true
    collect_schemas:
      enabled: true
    tags:
      - "env:%%env_DD_ENV%%"
      - "service:%%env_DD_SERVICE_PG_ROUTER%%"
      - "version:%%env_DD_VERSION%%"
      - "cluster:movida-pg"
      - "db_cluster:movida-pg"
      - "db_role:router_write"
      - "db_router_port:6446"
      - "db_load_balancer:%%env_DD_SERVICE_PG_LB%%"
      - "db_router:%%env_DD_SERVICE_PG_ROUTER%%"
    relations:
      - relation_regex: '.*'
        relkind:
          - r
          - i

  # ── Router LEITURA :6447 (rota read -> primary + replica) ──
  - host: pg-router
    port: 6447
    username: "%%env_POSTGRES_USER%%"
    password: "%%env_POSTGRES_PASSWORD%%"
    dbname: movida
    reported_hostname: "%%env_DD_SERVICE_PG_ROUTER%%-read"
    dbm: true
    query_metrics:
      enabled: false
    query_samples:
      enabled: false
    collect_schemas:
      enabled: false
    tags:
      - "env:%%env_DD_ENV%%"
      - "service:%%env_DD_SERVICE_PG_ROUTER%%"
      - "version:%%env_DD_VERSION%%"
      - "cluster:movida-pg"
      - "db_cluster:movida-pg"
      - "db_role:router_read"
      - "db_router_port:6447"
      - "db_load_balancer:%%env_DD_SERVICE_PG_LB%%"
      - "db_router:%%env_DD_SERVICE_PG_ROUTER%%"

  # ── No PRIMARY (DB-02 no diagrama) ──
  - host: pg-primary
    port: 5432
    username: "%%env_POSTGRES_USER%%"
    password: "%%env_POSTGRES_PASSWORD%%"
    dbname: movida
    reported_hostname: movida-pg-primary
    dbm: true
    query_metrics:
      enabled: false
    query_samples:
      enabled: false
    collect_schemas:
      enabled: false
    relations:
      - relation_regex: '.*'
        relkind:
          - r
          - i
    tags:
      - "env:%%env_DD_ENV%%"
      - "service:%%env_DD_SERVICE_PG_PRIMARY%%"
      - "version:%%env_DD_VERSION%%"
      - "cluster:movida-pg"
      - "db_cluster:movida-pg"
      - "db_node:primary"
      - "db_role:writer"
      - "db_load_balancer:%%env_DD_SERVICE_PG_LB%%"
      - "db_router:%%env_DD_SERVICE_PG_ROUTER%%"
    custom_queries:
      - metric_suffix: replication.lag_bytes
        query: SELECT COALESCE(pg_wal_lsn_diff(pg_current_wal_lsn(), replay_lsn), 0) AS lag FROM pg_stat_replication LIMIT 1;
        columns:
          - name: lag
            type: gauge
        tags:
          - query:replication_lag

  # ── No REPLICA / SECONDARY (DB-01/DB-03 no diagrama) ──
  - host: pg-replica
    port: 5432
    username: "%%env_POSTGRES_USER%%"
    password: "%%env_POSTGRES_PASSWORD%%"
    dbname: movida
    reported_hostname: movida-pg-replica
    dbm: false
    tags:
      - "env:%%env_DD_ENV%%"
      - "service:%%env_DD_SERVICE_PG_REPLICA%%"
      - "version:%%env_DD_VERSION%%"
      - "cluster:movida-pg"
      - "db_cluster:movida-pg"
      - "db_node:replica"
      - "db_role:reader"
      - "db_load_balancer:%%env_DD_SERVICE_PG_LB%%"
      - "db_router:%%env_DD_SERVICE_PG_ROUTER%%"
