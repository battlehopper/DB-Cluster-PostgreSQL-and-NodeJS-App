init_config:

instances:
  - host: pg-primary
    port: 5432
    username: "%%env_POSTGRES_USER%%"
    password: "%%env_POSTGRES_PASSWORD%%"
    dbname: movida
    reported_hostname: movida-pg-primary
    dbm: true
    collect_schemas:
      enabled: true
    tags:
      - "env:%%env_DD_ENV%%"
      - "service:%%env_DD_SERVICE_PG_PRIMARY%%"
      - "version:%%env_DD_VERSION%%"
      - "cluster:movida-pg"
      - "db_cluster:movida-pg"
      - "db_node:primary"
      - "db_role:writer"
      - "db_load_balancer:%%env_DD_SERVICE_PG_LB%%"
    relations:
      - relation_regex: '.*'
        relkind:
          - r
          - i
    custom_queries:
      - metric_suffix: replication.lag_bytes
        query: SELECT COALESCE(pg_wal_lsn_diff(pg_current_wal_lsn(), replay_lsn), 0) AS lag FROM pg_stat_replication LIMIT 1;
        columns:
          - name: lag
            type: gauge
        tags:
          - query:replication_lag

  - host: pg-replica
    port: 5432
    username: "%%env_POSTGRES_USER%%"
    password: "%%env_POSTGRES_PASSWORD%%"
    dbname: movida
    reported_hostname: movida-pg-replica
    dbm: true
    collect_schemas:
      enabled: true
    tags:
      - "env:%%env_DD_ENV%%"
      - "service:%%env_DD_SERVICE_PG_REPLICA%%"
      - "version:%%env_DD_VERSION%%"
      - "cluster:movida-pg"
      - "db_cluster:movida-pg"
      - "db_node:replica"
      - "db_role:reader"
      - "db_load_balancer:%%env_DD_SERVICE_PG_LB%%"
    relations:
      - relation_regex: '.*'
        relkind:
          - r
          - i
